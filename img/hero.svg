<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <style>
      @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes glowBlue { 0%, 100% { filter: drop-shadow(0 0 6px rgba(59,130,246,0.5)); } 50% { filter: drop-shadow(0 0 20px rgba(59,130,246,0.9)); } }
      @keyframes glowPurple { 0%, 100% { filter: drop-shadow(0 0 6px rgba(139,92,246,0.5)); } 50% { filter: drop-shadow(0 0 20px rgba(139,92,246,0.9)); } }
      @keyframes glowCyan { 0%, 100% { filter: drop-shadow(0 0 6px rgba(6,182,212,0.5)); } 50% { filter: drop-shadow(0 0 20px rgba(6,182,212,0.9)); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>

  <!-- Ambient neon glows -->
  <circle cx="1340" cy="-90" r="320" fill="#3b82f6" fill-opacity="0.10" filter="url(#blur)"/>
  <circle cx="-90" cy="430" r="280" fill="#8b5cf6" fill-opacity="0.08" filter="url(#blur)"/>

  <!-- Left glass bento card -->
  <rect x="60" y="56" width="690" height="308" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
  <rect x="60" y="56" width="690" height="4" rx="2" fill="#3b82f6"/>

  <!-- Kinetic typography (staggered fade-in) -->
  <text x="92" y="132" font-family="monospace" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.4"
        style="animation: fadeIn 1.2s ease-out 0.4s both;">FROM JIRA DASHBOARD</text>
  <text x="92" y="170" font-family="sans-serif" font-size="20" font-weight="700" fill="#3b82f6" style="animation: fadeIn 1.2s ease-out 1.1s both; animation-name: glowBlue;">→ MyGroovy Groovy RCE</text>
  <text x="92" y="208" font-family="monospace" font-size="15" fill="#cbd5e1" style="animation: fadeIn 1.2s ease-out 1.8s both;">nc -lvnp 4444 → reverse shell → interactive PTY</text>

  <!-- Right terminal pane -->
  <rect x="790" y="56" width="750" height="308" rx="18" fill="rgba(5,7,15,0.92)" stroke="rgba(255,255,255,0.05)"/>
  <rect x="790" y="56" width="750" height="34" rx="18" fill="rgba(255,255,255,0.02)"/>
  <circle cx="818" cy="73" r="6" fill="#ef4444"/>
  <circle cx="836" cy="73" r="6" fill="#f59e0b"/>
  <circle cx="854" cy="73" r="6" fill="#22c55e"/>
  <text x="820" y="80" font-family="monospace" font-size="13" fill="#64748b">root@jira:~$ groovy-console.execute()</text>
  <text x="820" y="130" font-family="monospace" font-size="13" fill="#3b82f6" style="animation: fadeIn 1s ease-out 2.2s both;">println "RCE obtained"</text>
  <text x="820" y="154" font-family="monospace" font-size="13" fill="#cbd5e1" style="animation: fadeIn 1s ease-out 2.7s both;">$ nc -lvnp 4444</text>
  <text x="820" y="178" font-family="monospace" font-size="13" fill="#06b6d4" style="animation: fadeIn 1s ease-out 3.2s both;">Connection from [192.168.2.37] accepted</text>
  <text x="820" y="202" font-family="monospace" font-size="13" fill="#a7f3d0" style="animation: fadeIn 1s ease-out 3.7s both;">jira@blackb0x:/opt/atlassian/jira/bin$</text>
  <text x="820" y="226" font-family="monospace" font-size="13" fill="#cbd5e1">_</text>
  <animate attributeName="fill" values="#cbd5e1;transparent" dur="0.9s" repeatCount="indefinite" begin="4.5s"/>

  <!-- Journey pipeline (bottom) -->
  <g transform="translate(92, 330)">
    <circle cx="0" cy="0" r="7" fill="#3b82f6" style="animation: glowBlue 2.5s ease-in-out infinite"/>
    <text x="24" y="6" font-family="monospace" font-size="13" fill="#64748b">JIRA dashboard</text>
    <line x1="96" y1="0" x2="178" y2="0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="190" cy="0" r="7" fill="#8b5cf6" style="animation: glowPurple 2.5s ease-in-out infinite 1.2s"/>
    <text x="214" y="6" font-family="monospace" font-size="13" fill="#64748b">Groovy RCE</text>
    <line x1="282" y1="0" x2="374" y2="0" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="386" cy="0" r="7" fill="#06b6d4" style="animation: glowCyan 2.5s ease-in-out infinite 2.4s"/>
    <text x="410" y="6" font-family="monospace" font-size="13" fill="#64748b">Reverse shell</text>
  </g>

  <!-- Status chip -->
  <rect x="92" y="362" width="128" height="22" rx="7" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.4)"/>
  <text x="108" y="378" font-family="monospace" font-size="11.5" fill="#3b82f6" font-weight="700">Authorized use</text>

  <!-- JIRA brand mark (small, top-right) -->
  <image href="./img/JIRA.jpg" x="1240" y="68" width="150" height="150" preserveAspectRatio="xMidYMid slice"
         style="opacity: 0.5; filter: grayscale(0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;"
         animation="fadeIn 1.2s ease-out 3.6s both"/>
</svg>
