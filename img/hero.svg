<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>

  <!-- Ambient glow orbs -->
  <circle cx="1240" cy="-120" r="340" fill="#3b82f6" fill-opacity="0.12" filter="url(#blur)"/>
  <circle cx="-120" cy="460" r="300" fill="#8b5cf6" fill-opacity="0.10" filter="url(#blur)"/>
  <circle cx="1560" cy="430" r="260" fill="#06b6d4" fill-opacity="0.08" filter="url(#blur)"/>

  <!-- Bento card 1 (left) -->
  <rect x="40" y="60" width="470" height="300" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="40" y="60" width="470" height="4" rx="2" fill="#3b82f6"/>
  <text x="72" y="128" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Reverse shell</text>
  <text x="72" y="162" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">from JIRA</text>
  <text x="72" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#94a3b8">MyGroovy &#8226; Groovy RCE &#8226; PTY shell</text>
  <text x="72" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#64748b">0x00 &#8226; 0x01 &#8226; 0x02 &#8226; 0x03</text>

  <!-- Bento card 2 (top right) -->
  <rect x="540" y="60" width="500" height="140" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="540" y="60" width="500" height="4" rx="2" fill="#8b5cf6"/>
  <text x="572" y="116" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#ffffff">masscan</text>
  <text x="572" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#94a3b8">./masscan 192.168.0.0-192.168.255.255 -p80,443,8080</text>

  <!-- Bento card 3 (bottom right) -->
  <rect x="540" y="220" width="500" height="140" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="540" y="220" width="500" height="4" rx="2" fill="#06b6d4"/>
  <text x="572" y="276" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#ffffff">reverse shell</text>
  <text x="572" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#94a3b8">nc -lvnp 4444 &#8226; /bin/bash -i</text>

  <!-- Bento card 4 (far right) -->
  <rect x="1070" y="60" width="490" height="300" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="1070" y="60" width="490" height="4" rx="2" fill="#ef4444"/>
  <text x="1102" y="128" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="700" fill="#ffffff">&#9888; Authorized use only</text>
  <text x="1102" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#94a3b8">Educational / CTF /</text>
  <text x="1102" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#94a3b8">your own systems</text>
  <circle cx="1200" cy="240" r="60" fill="#ffffff" fill-opacity="0.06"/>
  <text x="1172" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="48" font-weight="900" fill="#3b82f6" opacity="0.9">&#128269;</text>
  <text x="1102" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#64748b">2026 edition</text>
  <text x="1102" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#64748b">semtexbughunt</text>

  <!-- Accent lines -->
  <line x1="72" y1="228" x2="150" y2="228" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="572" y1="178" x2="650" y2="178" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="572" y1="338" x2="650" y2="338" stroke="#06b6d4" stroke-width="2"/>
</svg>
